name: Dependency Updates

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: develop
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      
      - name: Check for Composer updates
        id: composer_updates
        run: |
          composer update --dry-run > composer-updates.txt 2>&1 || true
          if grep -q "Nothing to install" composer-updates.txt; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Check for npm updates
        id: npm_updates
        run: |
          npm outdated > npm-updates.txt 2>&1 || true
          if [ -s npm-updates.txt ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Create Issue for updates
        if: steps.composer_updates.outputs.has_updates == 'true' || steps.npm_updates.outputs.has_updates == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Available Dependency Updates\n\n';
            
            if ('${{ steps.composer_updates.outputs.has_updates }}' === 'true') {
              const composerUpdates = fs.readFileSync('composer-updates.txt', 'utf8');
              body += '### Composer Dependencies\n\n```\n' + composerUpdates + '\n```\n\n';
            }
            
            if ('${{ steps.npm_updates.outputs.has_updates }}' === 'true') {
              const npmUpdates = fs.readFileSync('npm-updates.txt', 'utf8');
              body += '### NPM Dependencies\n\n```\n' + npmUpdates + '\n```\n\n';
            }
            
            body += 'Please review and update dependencies accordingly.';
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Weekly Dependency Update Check',
              body: body,
              labels: ['dependencies', 'automated']
            });
