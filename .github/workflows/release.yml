name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      
      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install npm dependencies
        run: npm ci
      
      - name: Build assets
        run: npm run build
      
      - name: Prepare release directory
        run: |
          mkdir -p release/ihumbak-semantic-search
          
          # Copy core plugin files
          cp ihumbak-semantic-search.php release/ihumbak-semantic-search/
          cp -r src release/ihumbak-semantic-search/
          cp -r build release/ihumbak-semantic-search/
          cp -r languages release/ihumbak-semantic-search/ 2>/dev/null || true
          
          # Copy vendor dependencies (production only)
          cp -r vendor release/ihumbak-semantic-search/
          
          # Copy readme if exists
          cp readme.txt release/ihumbak-semantic-search/ 2>/dev/null || true
          
          # Create changelog if exists
          cp CHANGELOG.md release/ihumbak-semantic-search/ 2>/dev/null || true
      
      - name: Create plugin zip
        run: |
          cd release
          zip -r ../ihumbak-semantic-search.zip ihumbak-semantic-search
          cd ..
          mkdir -p releases
          mv ihumbak-semantic-search.zip releases/
      
      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: releases/ihumbak-semantic-search.zip
          name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
